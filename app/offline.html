<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ef3a19">
<title>FotoWorks – Keine Verbindung</title>
<style>
:root{--red:#ef3a19;--red2:#ff5b19;--ink:#151515;--soft:#f5f5f3}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--soft);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(560px,100%);background:#fff;border-radius:20px;padding:34px;box-shadow:0 18px 55px #0002}
.logo{font-size:30px;font-weight:950;letter-spacing:-.055em;margin-bottom:26px}.logo b{color:var(--red)}
h1{font-size:40px;line-height:1;margin:0 0 14px;letter-spacing:-.04em}
p{color:#666;line-height:1.5}
button{border:0;border-radius:9px;padding:14px 20px;background:linear-gradient(90deg,var(--red),var(--red2));color:#fff;font-weight:900;cursor:pointer}
.small{font-size:12px;margin-top:22px;color:#888}
</style>
</head>
<body>
<main class="card">
  <div class="logo">foto<b>abzüge</b>.com</div>
  <h1>Keine Internetverbindung.</h1>
  <p>Für Preise, Foto-Upload und Bestellung benötigt FotoWorks eine Internetverbindung. Sobald die Verbindung wieder da ist, können Sie direkt weitermachen.</p>
  <button type="button" onclick="location.reload()">Erneut versuchen</button>
  <div class="small">FotoJoe APP · GETIN V27.1</div>
</main>
</body>
</html>
